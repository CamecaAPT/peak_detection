# defaultRunConfig.yaml — a --config override for detect_peaks_headless.py / detect_peaks_refactor.py,
# in the same nested schema as configs/models/rf.yaml (ranging/training/guardrails.*), merged on
# top of it. Consumed by ivas_autorange.csx (IVAS Script Console).
ranging:
  yolo_weights: best_v0_2026-06-23.pt
  iou: 0.01
  conf: 0.05
  max_det: 2000
  mc_min: 0.0
  mc_max: 307.2

training:
  training_path: peak_detection/IonIdentificationModels/training_data/NewData_truthcoverage_lightmol1p_C3_BO_C2O_2p_2026-06-10/Data0001
  training_num_files: 5000
  augment_molecule_training_charge_ratios: true
  include_molecules: false
  use_neighborhood: false
  neighbor_threshold: 2.0
  use_signature: false

guardrails:
  unknown_flagging:
    flag_unknowns: true
    mc_threshold: 0.2
    unknown_confidence_threshold: 0.6
    rf_accuracy_top_n: 1
  mixed_unknown:
    unknown_mixed_element_molecule_confidence_threshold: 0.95
  context_rescore:
    enabled: true
    context_window_da: 2.0
    context_strength: 0.35
    context_min_confidence: 0.75
    context_min_candidate_confidence: 0.05
    context_override_margin: 0.05
    context_distance_sigma: 0.75
    context_rescue_unknown_same_label: true
    context_rescue_unknown_min_score: 0.7
  molecule_rescue:
    enabled: true
    molecule_rf_rescue_threshold: 0.8
    molecule_rf_rescue_margin: 0.15
    molecule_rf_rescue_score_margin: 0.05
    molecule_rf_rescue_dist_margin: 0.05
  unknown_molecule_rf:
    enabled: true
    unknown_molecule_rf_threshold: 0.8

# Script-specific output-control (not read by load_merged_config; ivas_autorange.csx uses this
# section to preload its own grid, then passes these as direct CLI flags, not via --config).
output_control:
  progress_min_fraction: 0.2
  save_artifacts: true
  save_peak_ranges_txt: true
  save_rrng_with_uncertainty: true
